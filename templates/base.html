<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jiapu Source Manager{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        mark.hl { background: #fde68a; color: inherit; border-radius: 2px; padding: 0 1px; }
        {% block styles %}{% endblock %}
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="container mx-auto px-6 py-3 flex flex-wrap justify-between items-center gap-3">
            <a href="/" class="text-2xl font-bold tracking-tight">Jiapu Source Manager</a>
            <nav class="flex items-center gap-1 text-sm font-medium">
                {% set nav = [("home", "/", "Home"), ("browse", "/browse", "Sources"), ("search", "/find", "Search")] %}
                {% for key, href, label in nav %}
                <a href="{{ href }}"
                   class="px-3 py-1.5 rounded-lg transition-colors {% if active_page == key %}bg-white/20 text-white{% else %}text-indigo-100 hover:bg-white/10 hover:text-white{% endif %}">{{ label }}</a>
                {% endfor %}
            </nav>
        </div>
    </header>

    {% block content %}{% endblock %}

    <script>
        async function copySourceText(sourceId, button) {
            const originalLabel = button.textContent;
            try {
                const response = await fetch(`/sources/${sourceId}/text`);
                if (!response.ok) throw new Error('Unable to retrieve source text');

                await navigator.clipboard.writeText(await response.text());
                button.textContent = 'Copied!';
            } catch (error) {
                console.error(error);
                button.textContent = 'Copy failed';
            }

            window.setTimeout(() => { button.textContent = originalLabel; }, 2000);
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
